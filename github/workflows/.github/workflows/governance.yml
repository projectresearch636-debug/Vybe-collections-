name: Governance Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  governance:
    name: Governance Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate governance structure
        run: |
          echo "Validating repository governance structure."

          if [ -d ".github" ]; then
            echo ".github directory: present"
          else
            echo "::warning::.github directory is missing"
          fi

          echo "Governance validation completed."